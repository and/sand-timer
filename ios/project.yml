# The iPhone app. Generate the Xcode project with `xcodegen` in this folder.
# It shares the Mac app's own record, projects, sand physics and link format from ../Sources.
name: SandTimer
options:
  bundleIdPrefix: io.github.and
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: RLVYQT69D4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SandTimer:
    type: application
    platform: iOS
    sources:
      - SandTimer
      - path: ../Sources/Model.swift
        group: Shared
      - path: ../Sources/SandPhysics.swift
        group: Shared
      - path: ../Sources/Stats.swift
        group: Shared
      - path: ../Sources/Projects.swift
        group: Shared
      - path: ../Sources/TimerState.swift
        group: Shared
      - path: ../Sources/LinkFormat.swift
        group: Shared
      - path: ../Sources/LinkEngine.swift
        group: Shared
    info:
      path: SandTimer/Info.plist
      properties:
        # Staying connected to a linked Mac in the background, once linking is turned on.
        UIBackgroundModes: [bluetooth-central]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.and.sandtimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sand Timer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Sand Timer uses Bluetooth to share the timer, your projects and statistics with Sand Timer on your linked Mac.
        INFOPLIST_KEY_NSCameraUsageDescription: Sand Timer uses the camera only to scan the code your Mac shows when you link them.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1"
